name: Silbenzauber – Layout und Walzen prüfen
on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'logic.js'
      - 'tests/**'
      - '.github/workflows/silbenzauber-layout-tests.yml'
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'logic.js'
      - 'tests/**'
      - '.github/workflows/silbenzauber-layout-tests.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript prüfen
        run: |
          node --check app.js
          node --check logic.js
          node --test tests/logic.test.js
          node --test zahlenzauber/tests/logic.test.js
      - name: Chromium installieren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stabile Walzenmaße im echten Browser überprüfen
        run: node tests/reel-layout.browser.cjs
