name: Zahlenzauber – Prüfungen
on:
  push:
    paths:
      - 'zahlenzauber/**'
      - '.github/workflows/zahlenzauber-tests.yml'
  pull_request:
    paths:
      - 'zahlenzauber/**'
      - '.github/workflows/zahlenzauber-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-Syntax prüfen
        run: |
          node --check zahlenzauber/logic.js
          node --check zahlenzauber/app.js
      - name: Mathe-Spielregeln testen
        run: node --test zahlenzauber/tests/logic.test.js
      - name: Playwright Chromium installieren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Echtes Browserspiel prüfen
        run: node zahlenzauber/tests/browser-smoke.cjs
      - name: Screenshots speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zahlenzauber-browser-screenshots
          path: zahlenzauber/tests/screenshots/
          if-no-files-found: ignore
