  <radialGradient id="white" cx=".35" cy=".3"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#ddd2b8"/></radialGradient>
  <clipPath id="monkeyclip"><path d="M60 110H375V510H60Z"/></clipPath>
</defs>
